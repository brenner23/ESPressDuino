; ESPressDuino - Duino-Coin-Miner mit Web-Portal.
; Zugangsdaten stehen NICHT hier: WLAN/Duino-Konto im Einrichtungs-Portal,
; OTA-Passwort und OTA-Adressen in secrets.ini (Vorlage: secrets.example.ini).
[platformio]
default_envs = cyd_usb
extra_configs = secrets.ini

; Standardwerte, falls es keine secrets.ini gibt (secrets.ini ueberschreibt sie).
[secrets]
use_secrets =
ota_pass    =
ota_ip_cyd  = 192.168.0.100
ota_ip_nmtv = 192.168.0.100
ota_ip_c2   = 192.168.0.100
ota_ip_esp32 = 192.168.0.100
rig_name    = ESPressDuino
hostname    = espressduino
wifi_ssid   =
wifi_pass   =
duco_user   =
mining_key  =
duco_user2  =
mining_key2 =
src_dir = src
include_dir = include

[common]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board     = esp32dev
framework = arduino

; Verhindert das Schalten der RTS-Leitung (steuert den RST/EN-Pin an) -> kein Hard-Reset beim Oeffnen des Monitors
monitor_rts = 0
; Verhindert das Schalten der DTR-Leitung (steuert GPIO0 an) -> verhindert ungewollten Wechsel in den Bootloader-Modus
monitor_dtr = 0

board_build.partitions  = min_spiffs.csv
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB

monitor_speed = 500000
lib_ldf_mode  = deep+

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library @ 1.11.0
    adafruit/Adafruit GFX Library @ 1.12.6
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
    bblanchon/ArduinoJson @ 7.4.3

build_flags =
    -O3
    -DCORE_DEBUG_LEVEL=0
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src"
    -DARDUINO_ARCH_ESP32
    -DOTA_PASSWORD=\"${secrets.ota_pass}\"
    -DED_USE_SECRETS=0${secrets.use_secrets}
    -DED_S_RIG=\"${secrets.rig_name}\"
    -DED_S_HOST=\"${secrets.hostname}\"
    -DED_S_SSID=\"${secrets.wifi_ssid}\"
    -DED_S_WPASS=\"${secrets.wifi_pass}\"
    -DED_S_USER1=\"${secrets.duco_user}\"
    -DED_S_KEY1=\"${secrets.mining_key}\"
    -DED_S_USER2=\"${secrets.duco_user2}\"
    -DED_S_KEY2=\"${secrets.mining_key2}\"
    -I include
    -I include/Fonts
    -Wno-deprecated-declarations
    -Wno-write-strings
    -w

; ---------------- CYD ESP32-2432S028 ----------------
[env:cyd_usb]
extends         = common
build_flags     = ${common.build_flags} -DBOARD_CYD
upload_protocol = esptool
upload_speed    = 921600

[env:cyd_ota]
extends         = common
build_flags     = ${common.build_flags} -DBOARD_CYD
upload_protocol = espota
upload_port     = ${secrets.ota_ip_cyd}
upload_flags =
    --port=3232
    --auth=${secrets.ota_pass}

; ---------------- NM-TV-154 (NerdMiner TV) ----------------
[env:nmtv_usb]
extends         = common
build_flags     = ${common.build_flags} -DBOARD_NMTV154
upload_protocol = esptool
upload_speed    = 921600

[env:nmtv_ota]
extends         = common
build_flags     = ${common.build_flags} -DBOARD_NMTV154
upload_protocol = espota
upload_port     = ${secrets.ota_ip_nmtv}
upload_flags =
    --port=3232
    --auth=${secrets.ota_pass}

; ---------------- MiniTV ESP32-C2 (ein Kern) ----------------
; Arduino fuer den C2 kommt aus dem Tasmota-Build (wie im bisherigen C2-Projekt).
[env:c2_usb]
extends         = common
platform        = espressif32
board           = esp32-c2-devkitm-1
build_flags     = ${common.build_flags} -DBOARD_C2_DUCO
upload_protocol = esptool

[env:c2_ota]
extends         = env:c2_usb
upload_protocol = espota
upload_port     = ${secrets.ota_ip_c2}
upload_flags =
    --port=3232
    --auth=${secrets.ota_pass}

; ---------------- ESP32 ohne Display (DevKit, USB-C/Micro-USB) ----------------
[env:esp32_usb]
extends         = common
build_flags     = ${common.build_flags} -DBOARD_ESP32_HEADLESS
upload_protocol = esptool

[env:esp32_ota]
extends         = env:esp32_usb
upload_protocol = espota
upload_port     = ${secrets.ota_ip_esp32}
upload_flags =
    --port=3232
    --auth=${secrets.ota_pass}
